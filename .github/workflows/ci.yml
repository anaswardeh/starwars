name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check server.js

      - name: Smoke test server
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000/healthz > /dev/null; then
              echo "Server is up"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3000/healthz
          curl -sf http://localhost:3000/api/characters
          kill $SERVER_PID

      - name: Build Docker image
        run: docker build -t starwars-express .
