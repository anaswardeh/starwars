<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Wars - Express | View Characters</title>
  <!-- Latest compiled and minified CSS & JS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <script src="https://code.jquery.com/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</head>

<body>

  <div class="container">
    <div class="jumbotron">
      <h1>Star Wars Express</h1>
      <h3>The greatest resource in the galaxy for Star Wars statistics!</h3>
      <hr>
      <a href="/add"><button class="btn btn-danger btn-lg"><span class="fa fa-plus"></span> Add New Character</button></a>
      <a href="/api/characters"><button class="btn btn-danger btn-lg"><span class="fa fa-eye"></span> All Characters</button></a>
    </div>
    <div class="row">

      <div class="col-12">

        <div class="card mb-4">
          <div class="card-header">
            <h3><strong>Character Search</strong></h3>
          </div>
          <div class="card-body">
            <form id="search-form" role="form" novalidate>
              <input type="text" id="character-search" class="form-control" placeholder="Search for a character by name">
              <br>
              <div class="text-right">
                <button type="submit" class="btn btn-primary btn-md" id="search-btn">
                  <span class="fa fa-search"></span> Search Your Feelings. You know it is true.
                </button>
              </div>
            </form>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3><strong>Character Statistics</strong></h3>
          </div>
          <div class="card-body">
            <h2 id="name">Search for a character to see their stats.</h2>
            <div id="stats" style="display: none;">
              <h3><strong>Role:</strong> <span id="role"></span></h3>
              <h3><strong>Age:</strong> <span id="age"></span></h3>
              <h3><strong>Force Points:</strong> <span id="force-points"></span></h3>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="text/javascript">
    function showCharacter(data) {
      $("#name").text(data.name);
      $("#role").text(data.role);
      $("#age").text(data.age);
      $("#force-points").text(data.forcePoints);
      $("#stats").show();
    }

    function showNotFound() {
      $("#name").text("The force is not strong with this one. Your character was not found.");
      $("#stats").hide();
    }

    $("#search-form").on("submit", function(event) {
      event.preventDefault();

      var searchedCharacter = $("#character-search").val().trim().replace(/\s+/g, "").toLowerCase();

      if (!searchedCharacter) {
        $("#name").text("Please enter a character name to search.");
        $("#stats").hide();
        return;
      }

      $.get("/api/characters/" + encodeURIComponent(searchedCharacter))
        .done(function(data) {
          showCharacter(data);
        })
        .fail(function() {
          showNotFound();
        });
    });
  </script>
</body>

</html>
